<!doctype html><meta charset="utf-8"><title>icon check</title>
<script type="importmap">
{ "imports":{ "react":"https://esm.sh/react@18.3.1","react-dom":"https://esm.sh/react-dom@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client","htm":"https://esm.sh/htm@3.1.1" }}
</script>
<div id="root"></div><div id="m" style="font:12px monospace"></div>
<script type="module">
import {html, Icon} from "../src/lib.js";
import {createRoot} from "react-dom/client";
createRoot(document.getElementById("root")).render(html`<div>
  <span id="up"><${Icon} name="trend" size=${14} stroke=${2.2}/></span>
  <span id="dn"><${Icon} name="trendDown" size=${14} stroke=${2.2}/></span>
  <span id="pc"><${Icon} name="percent" size=${18}/></span>
  <span id="bad"><${Icon} name="ไม่มีจริง" size=${14}/></span></div>`);
setTimeout(()=>{ const d=id=>document.querySelector("#"+id+" path").getAttribute("d");
  document.getElementById("m").textContent = "CHECK up="+d("up")+" || dn="+d("dn")+" || pc="+d("pc")+" || fallbackDiffers="+(d("bad")!==d("dn"))+" END"; }, 1500);
</script>
