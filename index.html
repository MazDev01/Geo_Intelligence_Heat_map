<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GeoIntel — Enterprise Geo Intelligence Platform</title>

<!-- Single global typeface: Noto Sans Thai (400/500/600/700) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<!-- Leaflet + OpenStreetMap/CARTO (no Google Maps) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
:root{
  /* LIGHT theme for chrome (panels · sidebar · header · reports · admin). The MAP + heatmap + markers
     stay dark — they are drawn by Leaflet/Three with hard-coded colours (lmap.js/globe.js/lib.js) and the
     map container is pinned dark (.leaflet-container ... !important below), so none of these vars reach them. */
  --bg:#eef1f7; --bg2:#e4e9f1; --surface:#ffffff; --surface2:#f5f7fb;
  --panel:rgba(255,255,255,.95); --glass:rgba(255,255,255,.75);
  --stroke:rgba(30,45,80,.12); --stroke2:rgba(30,45,80,.20);
  /* ลำดับชั้นสีตัวอักษรบนพื้นสว่าง 3 ระดับเท่านั้น (ทั้งระบบ) — ทุกค่าผ่าน contrast ≥ 4.5:1 บนพื้นขาว
     1) ข้อความหลัก  --txt  #161d2b  (~14:1)  หัวข้อ/ตัวเลข/ชื่อ+ค่าในตาราง
     2) ข้อความรอง  --muted #475569 (slate-600 ~7:1) คำอธิบาย/ป้ายกำกับ/หัวตาราง/legend/label
     3) ข้อความจาง  --dim   #5e6b7b (slate-500 เข้มเล็กน้อย) หน่วย/เชิงอรรถ/placeholder เท่านั้น
        * ใช้ #5e6b7b แทน slate-500 บริสุทธิ์ (#64748b) เพราะบนพื้นหน้าเพจ #eef1f7 ที่ไม่ใช่ขาวสนิท
          slate-500 วัดได้ ~4.2:1 (ตก) — ค่านี้ผ่าน ≥4.5:1 บนทุกพื้นผิว (ขาว/สำรอง/พื้นเพจ) */
  --txt:#161d2b; --muted:#475569; --dim:#5e6b7b;
  /* สีแบรนด์ GeoIntel/MAZ — โทนแดง-ชมพู (chrome: ปุ่ม/ลิงก์/accent) */
  --accent:#e60023; --accent2:#ff3b5c; --teal:#ff7aa8;
  --accent-deep:#b30019; --accent-soft:#ffe4e6;
  /* ── Design token กลางของ dropdown/select ทุกตัวในระบบ (ทุกบทบาท) ── */
  --dropdown-bg:#FFFFFF; --dropdown-shadow:0 10px 15px -3px rgba(0,0,0,.1); --dropdown-border:1px solid #E5E7EB;
  --dropdown-text:#374151;                 /* เทาเข้ม/ถ่าน บนพื้นขาว contrast ~9.4:1 (ผ่าน WCAG AA) */
  --dropdown-hover-bg:#fff1f2;             /* ชมพูจางมาก (ตาม accent แบรนด์) เมื่อ hover */
  --dropdown-active-text:#b30019;          /* ชมพูแบรนด์ (เข้มพอให้ contrast ~4.9:1 บนพื้นชมพูอ่อน) ตัวหนา */
  --dropdown-active-bg:#ffe4e6;            /* ชมพูอ่อน tint ของ accent — แถวที่ถูกเลือกอยู่ */
  /* สีสื่อข้อมูล (คงเดิม): หมุดลูกค้า/Lead, heatmap, เกรด — ไม่เปลี่ยนเป็นแดง-ชมพู */
  --existing:#2563eb; --prospect:#0ea5e9; --heat:#ff5a3c; --heat2:#ffb02e;
  --good:#15a34a; --warn:#c67a09; --bad:#dc2626; --purple:#7c3aed;
  --a:#15a34a; --b:#d68a10; --c:#dc2626;   /* เกรด A เขียว · B เหลือง · C แดง (ไฟจราจร) */
  --font:'Noto Sans Thai',sans-serif;

  /* ===== Design Token (โครงสร้างเดียวกับ design-system) — ปรับสีเป็นโทนแดง-ชมพู ===== */
  /* มาตราส่วนมุมโค้ง */
  --radius:0.75rem;
  --radius-sm:calc(var(--radius) * 0.6); --radius-md:calc(var(--radius) * 0.8);
  --radius-lg:var(--radius); --radius-xl:calc(var(--radius) * 1.4); --radius-2xl:calc(var(--radius) * 1.8);
  --r:14px; --r2:10px;   /* ตัวแปรเดิม (คงไว้เพื่อความเข้ากันได้) = ~radius-xl / radius-md */
  /* มาตราส่วนเงา */
  --shadow-sm:0 1px 2px oklch(0 0 0 / 0.06);
  --shadow:0 2px 8px oklch(0 0 0 / 0.08);
  --shadow-md:0 4px 16px oklch(0 0 0 / 0.10);
  --shadow-lg:0 8px 32px oklch(0 0 0 / 0.12);
  /* โทเคนสีเชิงความหมาย (light theme, แดง-ชมพู) */
  --background:var(--bg); --foreground:var(--txt);
  --card:var(--surface); --card-foreground:var(--txt);
  --muted-foreground:var(--muted); --border:var(--stroke2); --input:var(--stroke2); --ring:#e60023;
  --primary:#e60023; --primary-foreground:#ffffff;
  --secondary:#ffe4e6; --secondary-foreground:#6b0010;
  --accent-foreground:#6b0010;
  --destructive:#d92d20; --destructive-foreground:#ffffff;
  /* จานสีกราฟเชิงหมวดหมู่ (ตาม design-system): แดงแบรนด์ / ส้มอำพัน / น้ำเงิน / เขียว / ม่วง */
  --chart-1:#e60023; --chart-2:#fb923c; --chart-3:#3b82f6; --chart-4:#16a34a; --chart-5:#7c3aed;
  /* มาตราส่วนตัวอักษร (ฟอนต์ Noto Sans Thai เดิม เปลี่ยนแค่ scale ขนาด/น้ำหนัก) */
  --type-display:3rem/1.1 700; --type-h1:2.25rem/1.15 700; --type-h2:1.875rem/1.2 700;
  --type-h3:1.5rem/1.25 600; --type-h4:1.25rem/1.3 600; --type-h5:1.125rem/1.4 600;
  --type-body-lg:1.0625rem/1.6 400; --type-body:0.9375rem/1.6 400; --type-body-sm:0.8125rem/1.55 400;
  --type-caption:0.75rem/1.4 500; --type-overline:0.6875rem/1.4 700;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:
    radial-gradient(1100px 700px at 82% -8%, #e3ebf7 0%, transparent 55%),
    radial-gradient(900px 600px at 5% 105%, #e6edf6 0%, transparent 50%),
    var(--bg);
  color:var(--txt);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
/* keep the globe/map stage DARK (the globe canvas is transparent; the map tiles pin their own dark bg) */
.globe-stage{background:#070b14}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,160,220,.22);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(230, 0, 35,.35)}
/* ===== Global typography: Noto Sans Thai everywhere (forms, SVG charts, Leaflet, tooltips) ===== */
html,body,input,button,select,textarea,optgroup,option,svg,svg text,tspan,
.leaflet-container,.leaflet-container *,.leaflet-tooltip,.leaflet-popup,.globe-tip{font-family:var(--font)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.3px}
h1{font-weight:700}                 /* page titles only */
h2{font-weight:700}
h3{font-weight:600}                 /* section titles */
label,.nav-item,.tab,.chip{font-weight:500}   /* labels & menus */

/* ============ APP SHELL ============ */
.shell{display:grid;grid-template-columns:248px 1fr;height:100%}
.shell.collapsed{grid-template-columns:72px 1fr}
.shell.no-nav{grid-template-columns:1fr}   /* บทบาทภาคสนาม (ผู้บริหาร/TC) — ไม่มีแถบเมนู แผนที่เต็มความกว้าง */
/* floating brand in the topbar (field roles Management/TC, replaces the sidebar logo) */
.tb-brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:none;background:transparent;padding:0;font-family:var(--font)}
.tb-brand .mk{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:conic-gradient(from 210deg,#e60023,#ff3b5c,#ff8a9c,#e60023);box-shadow:0 0 18px rgba(255,122,168,.32)}
.tb-brand .mk svg{width:18px;height:18px}
.tb-brand .nm{font-weight:700;font-size:14.5px;letter-spacing:.3px;line-height:1;color:var(--txt);text-align:left}
.tb-brand .nm small{display:block;font-size:9.5px;letter-spacing:2.2px;color:var(--dim);font-weight:600;margin-top:3px}
.sidebar{background:linear-gradient(180deg,#ffffff,#f5f7fb);
  border-right:1px solid var(--stroke);display:flex;flex-direction:column;overflow:hidden;z-index:30}
.sb-brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--stroke)}
.sb-brand .mk{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:conic-gradient(from 210deg,#e60023,#ff3b5c,#ff8a9c,#e60023);box-shadow:0 0 22px rgba(255,122,168,.35)}
.sb-brand .mk svg{width:19px;height:19px}
.sb-brand .nm{font-weight:700;font-size:15.5px;letter-spacing:.3px;line-height:1}
.sb-brand .nm small{display:block;font-size:10px;letter-spacing:2.4px;color:var(--dim);font-weight:600;margin-top:3px}
.collapsed .sb-brand .nm{display:none}
.sb-scroll{flex:1;overflow-y:auto;padding:12px 10px}
.sb-group{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
  padding:14px 12px 7px;font-weight:700}
.collapsed .sb-group{text-align:center;font-size:9.5px;padding:12px 0 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);
  color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:3px;position:relative;transition:.16s;cursor:pointer}
.nav-item:hover{background:rgba(30,45,80,.05);color:var(--txt)}
.nav-item.on{background:linear-gradient(90deg,rgba(230, 0, 35,.16),rgba(230, 0, 35,.04));color:var(--accent-deep)}
.nav-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent2)}
.nav-item .ic{width:18px;height:18px;flex:none;opacity:.9}
.collapsed .nav-item{justify-content:center;padding:11px}
.collapsed .nav-item .lb{display:none}
.sb-foot{padding:12px 14px;border-top:1px solid var(--stroke);font-size:12.5px;color:var(--dim)}
.collapsed .sb-foot{display:none}

/* ============ TOPBAR ============ */
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;
  border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.82);backdrop-filter:blur(14px);z-index:850}
.hamb{width:34px;height:34px;border-radius:9px;border:1px solid var(--stroke2);display:grid;place-items:center;color:var(--muted)}
.hamb:hover{color:var(--txt)}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs b{color:var(--txt)}
/* breadcrumb แบบคลิกได้ (หน้าหลัก > ประเทศไทย > จังหวัด) */
.crumbs.crumbs-nav{font-size:13.5px;font-weight:500;display:flex;align-items:center}
.crumbs .crumb-link{color:var(--muted);cursor:pointer;transition:color .15s;border:none;background:transparent;font:inherit;padding:0}
.crumbs .crumb-link:hover{color:var(--accent)}
.crumbs .crumb-sep{color:var(--stroke2);margin:0 7px}
.crumbs .crumb-cur{color:var(--txt);font-weight:700}
/* โหมดมืดของแผนที่ — กลับสีเฉพาะไทล์ OSM เท่านั้น (heat/marker อยู่ overlayPane คนละชั้น จึงไม่ถูกกระทบ)
   ยังใช้ไทล์ OpenStreetMap 100% ไม่เปลี่ยนผู้ให้บริการ แก้เฉพาะสูตรฟิลเตอร์
   เหตุผลของค่าใหม่: พื้นดิน OSM (#f2efe9) กับถนน (#ffffff) สว่างต่างกันแค่ ~6%
   พอ invert แล้วทั้งคู่จะจมไปกองรวมกันแถบสีดำ · ค่าเดิม brightness(.92) contrast(.92)
   ยิ่ง "บีบ" ช่องว่างนั้นให้แคบลงอีก ถนนจึงหายไปกับพื้นหลัง
   ค่าใหม่จึงกลับทิศเป็น brightness>1 (ยกโทนมืดที่ถูกบดให้ลอยขึ้น) และ contrast>1 (ถ่างระยะห่างให้กว้างขึ้น)
   ทำให้ขอบถนนและตัวอักษรชื่อสถานที่แยกออกจากพื้นหลังชัดเจน */
.map-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.68) contrast(1.06) saturate(.2)}
.searchbox{margin-left:8px;display:flex;align-items:center;gap:8px;background:rgba(30,45,80,.04);
  border:1px solid var(--stroke2);border-radius:10px;padding:8px 12px;min-width:260px}
.searchbox input{background:none;border:none;color:var(--txt);font-size:13px;width:100%;outline:none}
.searchbox svg{opacity:.5}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--stroke2);display:grid;place-items:center;
  color:var(--muted);position:relative}
.icon-btn:hover{color:var(--txt);border-color:var(--accent)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 7px var(--bad)}
.userbtn{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:22px;border:1px solid var(--stroke2)}
.userbtn:hover{border-color:var(--accent)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff3b5c,#e60023);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#04121a;flex:none}
.userbtn .un{font-size:12.5px;font-weight:700;line-height:1.15}
.userbtn .ur{font-size:11.5px;color:var(--dim)}
.role-pill{font-size:11px;font-weight:700;letter-spacing:.6px;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.role-admin{background:rgba(220,38,38,.14);color:var(--bad)}
.role-user{background:rgba(255, 59, 92,.16);color:var(--accent2)}

/* dropdown */
.dropdown{position:absolute;right:0;top:52px;min-width:220px;background:var(--dropdown-bg);
  border:var(--dropdown-border);border-radius:12px;box-shadow:var(--dropdown-shadow);padding:8px;z-index:850;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.dd-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;font-size:13px;color:var(--dropdown-text);cursor:pointer}
.dd-item:hover,.dd-item:focus{background:var(--dropdown-hover-bg);color:var(--dropdown-text)}
.dd-item:hover .dim,.dd-item:hover .muted,.dd-item:focus .dim,.dd-item:focus .muted{color:var(--muted)}
.dd-item.sel{background:var(--dropdown-active-bg);color:var(--dropdown-active-text);font-weight:700}
.dd-item.sel .dim,.dd-item.sel .muted{color:var(--dropdown-active-text)}
.dd-sep{height:1px;background:var(--stroke);margin:6px 4px}
.dd-label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 11px 3px}
.dd-account{display:flex;align-items:center;gap:12px;padding:12px 12px 10px}
/* Profile Dropdown Panel (.userdd) — กระชับระยะห่างแนวตั้งให้ panel เตี้ยลง ยังคงอ่าน/กดง่าย
   สโคปเฉพาะ .userdd ไม่กระทบ dropdown แจ้งเตือนที่ใช้คลาส .dd-* ร่วมกัน */
.userdd{padding:6px}
.userdd .dd-account{padding:9px 12px 7px}
.userdd .dd-item{padding:7px 11px}
.userdd .dd-label{padding:4px 11px 2px}
.userdd .dd-sep{margin:3px 4px}
.userbtn .ub-meta{display:flex;flex-direction:column;text-align:left}

/* ============ PAGE ============ */
.page{flex:1;overflow-y:auto;padding:22px 24px 40px}
.page.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.page-head h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}
.page-head .sub{font-size:13px;color:var(--muted)}
.page-head .ph-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* แถบตัวกรองของหน้ารายงาน — ย้ายมาจาก OP_CSS ในไฟล์ reports.js ที่เดิมฉีดเฉพาะหน้ารายงานโอกาส
   ประกาศไว้ที่เดียวตรงนี้ เพื่อให้ทุกหน้ารายงานใช้หน้าตาชุดเดียวกันได้ ไม่ต้องเขียนซ้ำ */
.op-slicers{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;padding:12px 14px;
  background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r)}
.op-lab{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.op-sel{padding:8px 10px;border-radius:9px;border:var(--dropdown-border);background:var(--dropdown-bg);color:var(--dropdown-text);box-shadow:var(--dropdown-shadow);
  font-family:var(--font);font-size:12.5px;min-width:148px}
.op-clear{align-self:flex-end;padding:9px 15px;border-radius:9px;border:1px solid var(--stroke2);background:transparent;
  color:var(--muted);cursor:pointer;font-family:var(--font);font-size:12.5px}
.op-clear:hover{color:var(--txt);border-color:rgba(120,160,220,.45)}
/* ข้อความสรุปท้ายแถบช่วงวันที่ (จำนวนรายการที่เหลือหลังกรอง / คำอธิบายเมื่อหน้านั้นกรองไม่ได้) */
.rpt-daterange-note{flex:1;min-width:200px;align-self:flex-end;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.6}
@media(max-width:860px){.rpt-daterange-note{text-align:left;flex-basis:100%}}

/* หน้าที่เปิดเป็นแผงเต็มจอจะมีปุ่มกากบาทปิดลอยอยู่มุมขวาบน
   เว้นที่ด้านขวาของหัวข้อไว้ ปุ่มขวาสุดจะได้ไม่ไปซ้อนกับกากบาทจนดูเหมือนเป็นปุ่มเดียวกัน
   (ค่า 56px เท่ากับที่หน้ารายงานฝั่งผู้ใช้ใช้อยู่แล้ว จึงเว้นห่างเท่ากันทุกหน้า) */
.mdl-page .page-head{padding-right:56px}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent-deep);font-weight:700;margin-bottom:6px}

/* ============ CARDS / GRID ============ */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1250px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r);padding:18px;backdrop-filter:blur(10px)}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:14px;margin:0}
.card-h .ch-sub{font-size:13px;color:var(--muted)}
.card-h .sp{margin-left:auto}
.hoverable{transition:transform .18s, border-color .18s}
.hoverable:hover{transform:translateY(-2px);border-color:var(--stroke2)}

/* KPI */
.kpi{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r);padding:16px 17px;position:relative;overflow:hidden}
.kpi .kpi-ic{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.kpi .kv{font-size:27px;font-weight:700;letter-spacing:.4px;margin-top:2px}
.kpi .kk{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.kpi .kd{font-size:13px;margin-top:8px;display:flex;align-items:center;gap:5px}
.kpi .up{color:var(--good)} .kpi .down{color:var(--bad)}
.kpi .spark{position:absolute;left:0;right:0;bottom:0;height:26px;opacity:.5}

/* badges / chips / tags */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600}
.b-good{background:rgba(51,214,159,.15);color:#0f7a3d}
.b-warn{background:rgba(255,176,46,.15);color:#b45309}
.b-bad{background:rgba(220,38,38,.13);color:#c81e1e}
.b-info{background:rgba(255, 59, 92,.15);color:var(--accent-deep)}
.b-neutral{background:rgba(147,163,196,.14);color:var(--muted)}
.grade{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.gr-A{background:var(--a)}.gr-B{background:var(--b)}.gr-C{background:var(--c)}
/* hero grade tile (detail panel potential score) — reuses the system grade palette (A best = green) */
.grade-hero{width:56px;height:56px;flex:none;border-radius:13px;display:grid;place-items:center;
  font-size:30px;font-weight:800;color:#fff;line-height:1}
.grade-hero[data-g="A"]{background:var(--a)}
.grade-hero[data-g="B"]{background:var(--b)}
.grade-hero[data-g="C"]{background:var(--c)}
/* "i" info tooltip — hover + click, closes on outside click */
.infotip{position:relative;display:inline-flex;vertical-align:middle}
.infotip-i{width:16px;height:16px;border-radius:50%;border:1px solid var(--stroke2);background:rgba(255,255,255,.05);
  color:var(--muted);font-size:11.5px;font-weight:700;font-style:italic;font-family:var(--font);cursor:pointer;
  display:grid;place-items:center;line-height:1;padding:0;transition:.15s}
.infotip-i:hover{color:var(--txt);border-color:var(--accent)}
.infotip-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:60;width:max-content;max-width:238px;
  padding:11px 13px;border-radius:11px;background:var(--surface2);border:1px solid var(--stroke2);
  box-shadow:0 16px 40px rgba(0,0,0,.5);font-size:13px;line-height:1.7;color:var(--muted);font-weight:400;
  text-align:left;white-space:normal;animation:tipIn .16s ease}
.infotip-pop b{color:var(--txt);font-weight:600}
.itp-right .infotip-pop{left:auto;right:0}
@keyframes tipIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.chip{padding:7px 13px;border-radius:20px;font-size:12px;border:1px solid var(--stroke2);color:var(--muted);transition:.15s}
.chip.on{background:rgba(230, 0, 35,.16);border-color:var(--accent);color:var(--accent-deep)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}

/* แถบเลือกช่วงเวลาบนแดชบอร์ด */
.tf-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin-bottom:18px;
  padding:12px 16px;border-radius:14px;border:1px solid var(--stroke);background:var(--panel)}
.tf-head{display:flex;align-items:center;gap:8px;flex:none}
.tf-label{font-size:12.5px;font-weight:600;color:var(--txt)}
.tf-note{flex:1;min-width:200px;text-align:right;font-size:12px;color:var(--muted)}
@media(max-width:820px){.tf-note{text-align:left;min-width:0;flex-basis:100%}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;
  font-size:13px;font-weight:600;transition:.16s;white-space:nowrap}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.primary{background:linear-gradient(135deg,#e60023,#ff3b5c);color:#04121a;box-shadow:0 10px 24px rgba(230, 0, 35,.32)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(255, 59, 92,.36)}
.btn.ghost{border:1px solid var(--stroke2);color:var(--muted)}
.btn.ghost:hover{color:var(--txt);border-color:var(--accent)}
.btn.solid{background:rgba(255,255,255,.05);border:1px solid var(--stroke2);color:var(--txt)}
.btn.solid:hover{background:rgba(255,255,255,.09)}
.btn.danger{background:rgba(255,90,90,.14);border:1px solid rgba(255,90,90,.4);color:#ff9a9a}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* forms */
.field{margin-bottom:14px}
.lg-hint{font-size:11.5px;color:var(--dim);margin-top:5px}
.field label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:10px;background:var(--dropdown-bg);
  border:var(--dropdown-border);color:var(--dropdown-text);font-size:13.5px;outline:none;transition:.15s;box-shadow:var(--dropdown-shadow)}
.input:focus{border-color:var(--accent)}
select.input{appearance:none;cursor:pointer;color-scheme:light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' fill='%239CA3AF'><path d='M0 2l5 6 5-6z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
/* native <option> list — พื้นขาว ตัวหนังสือเทาเข้ม (Design token) · ตัวเลือกที่เลือกอยู่ = ชมพูแบรนด์ */
select.input option, select option{background-color:var(--dropdown-bg);color:var(--dropdown-text)}
select option:checked{background:var(--dropdown-active-bg);color:var(--dropdown-active-text);font-weight:700}
.toggle{width:38px;height:21px;border-radius:20px;background:#c7cdd9;position:relative;transition:.2s;flex:none;cursor:pointer}
.toggle.on{background:linear-gradient(90deg,#e60023,#ff3b5c)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on::after{left:19px}
input[type=range]{width:100%;accent-color:var(--accent2)}

/* table */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:11px 14px;border-bottom:1px solid var(--stroke);position:sticky;top:0;background:var(--surface)}
.table td{padding:11px 14px;border-bottom:1px solid var(--stroke)}
.table tbody tr{transition:.12s}
.table tbody tr:hover{background:rgba(255,255,255,.03)}
.table tr.clickable{cursor:pointer}
.table-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--stroke);background:var(--surface)}

/* tabs */
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:11px;padding:4px}
.tab{padding:8px 15px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent);color:#fff}
.tab:hover:not(.on){color:var(--txt)}

/* progress / meter */
.meter{height:9px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.meter > span{display:block;height:100%;border-radius:6px}
.seg-bar{height:11px;border-radius:6px;overflow:hidden;display:flex}
.seg-bar span{height:100%}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dotc{width:10px;height:10px;border-radius:50%;flex:none}

/* skeleton */
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));
  background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* modal */
.modal-ov{position:fixed;inset:0;background:rgba(4,7,14,.7);backdrop-filter:blur(6px);z-index:2000;
  display:grid;place-items:center;padding:24px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,96vw);max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--stroke2);
  border-radius:16px;box-shadow:var(--shadow)}
.modal.wide{width:min(920px,96vw)}
.modal-h{padding:20px 24px;border-bottom:1px solid var(--stroke);display:flex;align-items:center}
.modal-h h2{font-size:18px;margin:0}
.modal-b{padding:22px 24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--stroke);display:flex;gap:10px;justify-content:flex-end}

/* toast */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--stroke2);border-left:3px solid var(--good);border-radius:11px;
  padding:13px 16px;min-width:260px;box-shadow:var(--shadow);animation:slideUp .3s ease;font-size:13px}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}}

/* animations for pages */
/* `backwards` fill-mode holds the from-state during animation-delay, so staggered cards don't flash
   before their turn. No existing .fade-in user sets a delay, so their behaviour is unchanged. */
.fade-in{animation:fadeUp .4s ease backwards}
.province-card{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border-radius:14px;
  background:var(--panel);border:1px solid var(--stroke2);backdrop-filter:blur(14px);box-shadow:var(--shadow);
  cursor:pointer;text-align:left;font-family:var(--font);transition:transform .16s,box-shadow .16s,border-color .16s}
.province-card:hover{transform:translateY(-3px) scale(1.015);border-color:var(--accent);
  box-shadow:0 18px 40px rgba(0,0,0,.4),0 0 0 1px rgba(255, 59, 92,.25)}
.province-card:active{transform:translateY(-1px) scale(1.005)}
.province-card-cta{display:flex;align-items:center;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--stroke);
  font-size:12px;font-weight:700;color:var(--accent2);opacity:0;max-height:0;overflow:hidden;transition:opacity .16s,max-height .16s}
.province-card:hover .province-card-cta{opacity:1;max-height:30px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.slide-panel{animation:slideL .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:0;transform:translateX(26px)}}
/* left-docked drawer (Google-Maps-style customer detail) — slides in from the opposite edge */
.slide-panel-left{animation:slideLFromLeft .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slideLFromLeft{from{opacity:0;transform:translateX(-26px)}}

/* ============ LOGIN ============ */
.login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr .9fr;z-index:100;background:var(--bg)}
@media(max-width:900px){.login{grid-template-columns:1fr}.login .lg-side{display:none}}
.lg-side{position:relative;overflow:hidden;border-right:1px solid var(--stroke);
  background:radial-gradient(700px 500px at 60% 40%,#12274a,#070b14 70%)}
.lg-side #lg-globe{position:absolute;inset:0}
.lg-side .lg-cap{position:absolute;left:44px;bottom:44px;right:44px}
/* sits on the DARK globe panel — needs explicit light text, not the inherited (dark) var(--txt) */
.lg-side .lg-cap h2{font-size:30px;margin:0 0 10px;letter-spacing:.3px;line-height:1.2;color:#fff}
.lg-side .lg-cap p{color:var(--muted);font-size:14px;max-width:420px;line-height:1.6}
.lg-side .lg-tags{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.lg-tags .t{font-size:12.5px;color:var(--muted);border:1px solid var(--stroke2);border-radius:20px;padding:5px 12px}
.lg-form{display:grid;place-items:center;padding:30px}
.lg-card{width:min(380px,100%)}
.lg-card .mk{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin-bottom:16px;
  background:conic-gradient(from 210deg,#e60023,#ff3b5c,#ff8a9c,#e60023);box-shadow:0 0 30px rgba(255,122,168,.4)}
.lg-card h1{font-size:24px;margin:0 0 6px}
.lg-card .lgp{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.lg-remember{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:6px 0 18px}
.lg-remember label{display:flex;align-items:center;gap:8px;cursor:pointer}
.lg-remember .link{color:var(--accent2)}
.checkbox{width:17px;height:17px;border-radius:5px;border:1px solid var(--stroke2);display:grid;place-items:center}
.checkbox.on{background:var(--accent);border-color:var(--accent)}
.lg-roles{margin-top:22px;border-top:1px solid var(--stroke);padding-top:16px}
.lg-roles .rl{font-size:12.5px;color:var(--dim);margin-bottom:9px;text-transform:uppercase;letter-spacing:1px}
.lg-roles .rr{display:flex;gap:9px}
.lg-roles .rr button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--stroke2);color:var(--muted);font-size:12px;font-weight:600}
.lg-roles .rr button.on{border-color:var(--accent);background:rgba(230, 0, 35,.14);color:#fff}

/* ============ GLOBE / MAP CONTAINERS ============ */
.globe-stage{position:relative;flex:1;min-height:0}
#globe-canvas{position:absolute;inset:0}
/* พื้นหลัง map = สีพื้นดินของธีม Protomaps (สว่าง) — บริเวณนอก tile/นอกพื้นที่ให้บริการจะเป็นเทา-แทนกลมกลืน (เดิม #0a1120 กรมท่าเข้ม ไว้ใช้ raster) */
.leaflet-container{background:#e2dfda!important;font-family:var(--font)}
.leaflet-control-attribution{background:rgba(255,255,255,.78)!important;color:#5b6472!important}
.leaflet-control-attribution a{color:#2b3440!important}
/* ป้ายแจ้งเมื่ออยู่นอกพื้นที่ให้บริการ (ไม่มีไฟล์ basemap ครอบคลุม) — ขั้นที่ 5 fallback */
.basemap-oob{background:rgba(43,52,64,.85);color:#e8ecf2;font:500 12px var(--font);padding:6px 11px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.leaflet-bar a{background:var(--surface)!important;color:var(--muted)!important;border-color:var(--stroke)!important}
.leaflet-bar a:hover{background:var(--surface2)!important;color:#fff!important}
.map-legend,.map-panel{background:var(--panel);border:1px solid var(--stroke2);border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
/* Map-layers trigger: circular icon button (matches the +/- zoom controls), opens the layers panel as a popover */
.layers-fab{width:46px;height:46px;flex:none;border-radius:50%;background:var(--panel);border:1px solid var(--stroke2);
  box-shadow:0 6px 18px rgba(0,0,0,.35);backdrop-filter:blur(12px);display:grid;place-items:center;cursor:pointer;
  color:var(--txt);padding:0;transition:transform .16s ease, box-shadow .16s ease, background .16s ease}
.layers-fab:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(0,0,0,.45)}
.layers-fab.on{background:var(--accent2);border-color:var(--accent2);color:#04121a}
/* กล่องยึดตำแหน่งกลุ่มปุ่มมุมขวาบน — ลูกทุกตัววางแบบ absolute เทียบมุมขวาบนของกล่องนี้
   ไอคอนเลเยอร์กับแผงเลเยอร์จึงมีขอบบนตรงกันเป๊ะ (ไม่มี margin/gap มาดันแผงให้ต่ำลง) */
.layers-widget{width:0;height:0}
.layers-pop{transform-origin:top left;animation:layerpop .18s cubic-bezier(.2,.8,.2,1)}
/* ปุ่มหุบแผงเลเยอร์ (อยู่ในหัวแผง — ใช้ปิดแทนไอคอนเดิมที่ถูกซ่อนไปตอนแผงเปิด) */
.layers-close{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--stroke2);color:var(--muted);font-family:var(--font);padding:0}
.layers-close:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
@keyframes layerpop{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
/* collapsible floating tool panels — slide + fade, never permanently occupy the map */
.tool-panel{transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .26s ease; transform-origin:top}
.tool-panel.hide-left{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
.tool-panel.hide-right{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
/* ── หน้าตั้งค่าระบบ ── */
/* ช่องกรอกตัวเลขน้ำหนักคะแนน (คู่กับแถบเลื่อน) */
.cfg-num{display:inline-flex;align-items:center;gap:3px;flex:none;padding:5px 9px;border-radius:9px;
  border:1px solid var(--stroke2);background:var(--surface)}
.cfg-num input{width:42px;border:0;outline:0;background:transparent;color:var(--txt);font-family:var(--font);
  font-size:12.5px;font-weight:700;text-align:right;-moz-appearance:textfield}
.cfg-num input::-webkit-outer-spin-button,.cfg-num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cfg-num span{font-size:12px;color:var(--muted);font-weight:600}
/* แถวเลเยอร์แบบบรรทัดเดียว */
/* แถวเลเยอร์ — ทุกชิ้นอยู่แถวเดียวและพอดีกรอบการ์ด ไม่ล้นขอบขวา
   ⚠ สำคัญ: กฎกลาง input[type=range]{width:100%} มีความจำเพาะ (0,0,1,1) สูงกว่าคลาสเดี่ยว (0,0,1,0)
   ถ้าเขียนแค่ .cfg-layer-rng จะโดนกฎกลางทับ แถบเลื่อนยืดเต็มแล้วดัน %/ตัวอย่าง/สวิตช์ ตกขอบการ์ด
   จึงต้องเจาะจงด้วย element+class ให้ความจำเพาะสูงกว่า */
.cfg-layer{gap:9px;padding:9px 11px;margin-bottom:8px;border-radius:11px;align-items:center;cursor:grab;
  flex-wrap:nowrap;min-width:0;overflow:hidden}
.cfg-layer-nm{font-size:13px;font-weight:600;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-layer input[type=range].cfg-layer-rng{flex:0 0 auto;width:150px;max-width:34%;min-width:88px}
.cfg-layer-pct{font-size:12px;width:38px;text-align:right;flex:none;color:var(--muted)}
.cfg-layer-prev{height:10px;width:42px;border-radius:6px;flex:none}
.cfg-layer > :last-child{flex:none}   /* สวิตช์เปิด/ปิดท้ายแถว ห้ามถูกบีบ */
/* จอแคบ: ให้ชื่อขึ้นบรรทัดของตัวเอง แล้วแถบเลื่อนยืดเต็มแถวที่สองแทน */
@media (max-width:900px){
  .cfg-layer{flex-wrap:wrap}
  .cfg-layer-nm{flex:1 1 100%}
  .cfg-layer input[type=range].cfg-layer-rng{flex:1 1 auto;width:auto;max-width:none}
}
/* แถบบันทึกลอยด้านล่าง — โผล่เมื่อมีการแก้ไขที่ยังไม่บันทึก */
.cfg-bar-space{height:74px}
.cfg-bar{position:sticky;bottom:12px;z-index:30;display:flex;gap:10px;align-items:center;justify-content:flex-end;
  flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--stroke2);
  box-shadow:0 16px 44px rgba(0,0,0,.28);animation:pillIn .2s ease}
.cfg-bar-note{margin-right:auto;font-size:12.5px;font-weight:600;color:var(--accent-deep)}
/* ปุ่มลอยบนแผนที่ — ใช้พื้น var(--surface) ที่ทึบสนิท (ไม่ใช่ var(--panel) ที่โปร่ง 5%)
   เพราะปุ่มกลุ่มนี้ลอยอยู่บนแผนที่ซึ่งพื้นหลังเปลี่ยนได้ทั้งโหมดสว่าง/มืด ถ้าโปร่งจะกลืนกับแผนที่ */
.tool-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:22px;font-size:12.5px;font-weight:600;
  color:var(--txt);background:var(--surface);border:1px solid var(--stroke2);
  box-shadow:0 14px 40px rgba(0,0,0,.35);animation:pillIn .24s ease}
/* hover: ห้ามเปลี่ยนตัวอักษรเป็นสีขาวเพราะพื้นเป็นสีอ่อน จะอ่านไม่ออก — เน้นด้วยขอบสีแบรนด์แทน */
.tool-pill:hover{border-color:var(--accent)}
@keyframes pillIn{from{opacity:0;transform:scale(.9) translateY(-4px)}}
/* merged Filter+Layer panel — collapsible section header (accordion) */
.acc-head{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;padding:12px 14px;
  border:none;background:transparent;color:var(--txt);font-family:var(--font);cursor:pointer;transition:.15s}
.acc-head:hover{background:rgba(255,255,255,.045)}
/* post-login globe intro — Skip button (bottom-right, clear of the topbar and the centred globe hint) */
.intro-skip{position:fixed;bottom:28px;right:28px;z-index:2200;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font);font-size:13px;font-weight:600;color:var(--txt);cursor:pointer;padding:9px 16px;border-radius:22px;
  background:rgba(17,25,42,.72);border:1px solid var(--stroke2);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.45);
  transition:.16s;animation:fade .4s ease}
.intro-skip:hover{border-color:var(--accent);color:#fff}
/* Reports · single Export button (top-right) */
.export-btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--font);font-size:14.5px;font-weight:700;
  color:#fff;cursor:pointer;border:none;border-radius:12px;padding:12px 20px;
  background:linear-gradient(135deg,#e60023,#ff3b5c);box-shadow:0 10px 26px rgba(230, 0, 35,.45);transition:.16s}
.export-btn:hover{box-shadow:0 14px 34px rgba(230, 0, 35,.6);transform:translateY(-1px)}
.export-btn:active{transform:translateY(0)}
/* สไตล์ปุ่มแบบเส้นขอบ — ขอบสีชมพูแบรนด์ · ตัวอักษรและไอคอนสีเดียวกับขอบ · ไม่ทึบ · ไม่มีเงาเรือง
   ประกาศรวมไว้ที่เดียว ใช้ร่วมกันทั้งปุ่มส่งออกฝั่งผู้ใช้ และปุ่มหลักทุกปุ่มในหน้าผู้ดูแลระบบ
   (ไอคอนไม่ต้องกำหนดสีเอง เพราะ Icon วาดด้วย currentColor อยู่แล้ว จึงตามสีตัวอักษรของปุ่มไปเอง) */
.export-btn.export-secondary, .btn.outline{color:var(--accent-deep);border:1.5px solid var(--accent);box-shadow:none}
.export-btn.export-secondary:hover, .btn.outline:hover{background:var(--accent-soft);box-shadow:none;transform:none}
/* ฝั่งผู้ใช้: คงพื้นโปร่งและขนาดเดิมไว้ทุกอย่าง ไม่แตะ */
.export-btn.export-secondary{background:transparent;font-size:13.5px;padding:9px 16px}
/* ฝั่งผู้ดูแลระบบ: ใช้พื้นสีขาวทึบ เพราะพื้นหลังของหน้าเป็นสีเทาอ่อน (--bg)
   ถ้าปล่อยให้โปร่ง ตัวอักษรชมพูบนพื้นเทาจะได้อัตราส่วนความต่างสี 4.12:1 ซึ่งต่ำกว่าเกณฑ์ AA
   พอวางบนพื้นขาวจะได้ 4.66:1 ผ่านเกณฑ์ อ่านได้สบายตา */
.btn.outline{background:var(--surface)}
.report-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-size:13px;font-weight:700;
  color:#fff;cursor:pointer;border:none;border-radius:22px;padding:10px 16px;
  background:linear-gradient(135deg,#e60023,#ff3b5c);box-shadow:0 10px 26px rgba(230, 0, 35,.4);transition:.16s;
  backdrop-filter:blur(12px);animation:pillIn .24s ease}
.report-btn:hover{box-shadow:0 14px 32px rgba(230, 0, 35,.55);transform:translateY(-1px)}
.report-btn:active{transform:translateY(0)}
/* Country arrival — cinematic reveal (Google-Earth style), no loading screen */
@keyframes geoReveal{from{opacity:0}to{opacity:1}}
.map-reveal{animation:geoReveal .7s ease both}
.map-reveal .leaflet-marker-pane{animation:geoReveal .8s ease .32s both}   /* markers fade in after the map */
.map-reveal .leaflet-heatmap-layer{animation:geoReveal .95s ease .2s backwards}  /* heatmap fades in, keeps its own opacity */
.map-fx{animation:geoReveal .6s ease .12s backwards}   /* layers · filters · legend fade in */
/* Customer Visit Planning — selected highlight ring · start · numbered sequence markers */
.plan-ring{width:100%;height:100%;border-radius:50%;border:3px solid #ff3b5c;background:rgba(255,122,168,.12);
  box-shadow:0 0 14px rgba(255,122,168,.7);animation:planPop .3s ease}
.plan-num{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--font);
  font-size:14px;font-weight:800;color:#04121a;background:linear-gradient(135deg,#ff3b5c,#e60023);
  border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5);animation:planPop .3s ease}
.plan-office{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#04121a;
  background:#ffb02e;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
@keyframes planPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.cluster-pin{background:transparent}
.mk-tip{font-size:12px}
.mk-tip b{font-size:13px}
/* selected marker — glowing ring around the 32px marker */
.mk-pulse{width:46px;height:46px;border-radius:50%;background:transparent;border:3px solid #ff3b5c;
  box-shadow:0 0 16px rgba(255,122,168,.85), 0 0 0 0 rgba(255,122,168,.5);animation:mkpulse 1.5s infinite}
@keyframes mkpulse{0%{box-shadow:0 0 16px rgba(255,122,168,.85),0 0 0 0 rgba(255,122,168,.5)}70%{box-shadow:0 0 16px rgba(255,122,168,.85),0 0 0 14px rgba(255,122,168,0)}100%{box-shadow:0 0 16px rgba(255,122,168,.85),0 0 0 0 rgba(255,122,168,0)}}
/* status-coloured marker + business-category icon (GPU-accelerated hover/selected scale) */
.geo-mk{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.82);
  box-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .15s ease;will-change:transform;cursor:pointer;line-height:1;animation:mkFade .22s ease}
.geo-mk span{font-size:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.geo-mk svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.geo-mk:hover{transform:scale(1.28);z-index:1200}
.leaflet-marker-icon:has(.geo-mk){transition:none}
/* LOD wide/medium-zoom dots are drawn on a shared CANVAS via L.circleMarker (see lmap.js buildMarkers) —
   no DOM element per point, so no CSS rule here. Close-zoom full markers use .geo-mk above. */
@keyframes mkFade{from{opacity:0}to{opacity:1}}
/* smart cluster — count + category summary; ring colour = density */
.geo-cluster{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  padding:0 5px;background:radial-gradient(circle,rgba(16,24,42,.96),rgba(16,24,42,.85));border:2.5px solid #ff3b5c;
  color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.55);cursor:pointer;transition:transform .15s ease;will-change:transform}
.geo-cluster:hover{transform:scale(1.07)}
.gc-count{font-weight:800;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.55)}   /* font-size set inline per radius */
/* inline category row (large bubbles only) — width-constrained + clipped so it never exceeds the circle */
.gc-cats{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 6px;max-width:100%;margin-top:5px;line-height:1}
.gc-cat{display:inline-flex;align-items:center;font-size:12.5px}
.gc-cat b{font-size:10.5px;font-weight:700;margin-left:1px}
/* hover breakdown tooltip (all bubbles) */
.gc-tip .gc-row{display:block;margin-top:3px;font-size:12px;white-space:nowrap}

/* small util */
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.tnum{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--stroke);margin:16px 0;border:0}
.sec-label{font-size:12.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:20px 0 12px}
.big-num{font-size:34px;font-weight:700;line-height:1}
.pill-tab{display:inline-flex;gap:6px;font-size:12px}
.emptybox{padding:40px;text-align:center;color:var(--dim);font-size:13px}
.scrolly{overflow-y:auto}
</style>
